<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - 8 Week Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .week-card {
            background: #fff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            max-width: 700px;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .breakdown {
            margin-top: 10px;
        }

        .friend-entry {
            margin-left: 10px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 200px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .center {
            text-align: center;
            margin-bottom: 20px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            margin: 0 10px;
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>8-Week Money Dashboard</h1>

    <div class="center">
        <form method="get" action="/dashboard/">
            <input type="text" name="user_id" placeholder="Enter your user_id" required>
            <button type="submit">Load Dashboard</button>
        </form>
    </div>

    <div class="links">
        <a href="/create-form/" target="_blank">Create Transaction</a>
    </div>
</body>
</html>
