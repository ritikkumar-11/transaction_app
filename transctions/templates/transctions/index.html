<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - 8 Week Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .week-card {
            background: #fff;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            max-width: 700px;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .breakdown {
            margin-top: 10px;
        }

        .friend-entry {
            margin-left: 10px;
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 200px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        .center {
            text-align: center;
            margin-bottom: 20px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            margin: 0 10px;
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>8-Week Money Dashboard</h1>

    <div class="center">
        <input type="text" id="user_id" placeholder="Enter your user_id">
        <button onclick="loadDashboard()">Load Dashboard</button>
    </div>

    <div id="dashboard"></div>

    <div class="links">
        <a href="/dashboard/?user_id=1" target="_blank">View Dashboard (User 1)</a>
        <a href="/api/transactions/" target="_blank">View All Transactions</a>
        <a href="/api/friends/" target="_blank">View All Friends</a>
        <a href="/create-form/" target="_blank">Create Transaction</a> <!-- Added link -->
    </div>

    <script>
        async function loadDashboard() {
            const userId = document.getElementById('user_id').value;
            if (!userId) {
                alert("Please enter user_id");
                return;
            }

            const response = await fetch(`/dashboard/?user_id=${userId}`);
            const data = await response.json();

            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            data.forEach(week => {
                const card = document.createElement('div');
                card.className = 'week-card';

                card.innerHTML = `
                    <h2>Week ${week.week} (${week.from_date} - ${week.to_date})</h2>
                    <div class="summary">
                        <span>To Pay: ₹${week.to_pay_total}</span>
                        <span>To Receive: ₹${week.to_receive_total}</span>
                    </div>

                    <div class="breakdown">
                        <strong>Pay Breakdown:</strong>
                        ${week.to_pay_breakdown.map(e => `<div class="friend-entry">${e.friend}: ₹${e.amount}</div>`).join('') || '<div class="friend-entry">None</div>'}
                    </div>

                    <div class="breakdown">
                        <strong>Receive Breakdown:</strong>
                        ${week.to_receive_breakdown.map(e => `<div class="friend-entry">${e.friend}: ₹${e.amount}</div>`).join('') || '<div class="friend-entry">None</div>'}
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
